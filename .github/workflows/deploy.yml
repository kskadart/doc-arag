name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Yandex Cloud
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker/compose.prod.yml"
          target: "/opt/doc-arag"
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/doc-arag
            
            # Create .env file from GitHub Secrets
            cat > .env << 'EOF'
            IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            LLM_PROVIDER=${{ vars.LLM_PROVIDER || 'openai' }}
            LLM_BASE_URL=${{ vars.LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            LLM_MODEL=${{ vars.LLM_MODEL || 'qwen/qwen3.8-flash' }}
            LLM_EXTRA_BODY=${{ vars.LLM_EXTRA_BODY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            ANTHROPIC_MODEL=${{ vars.ANTHROPIC_MODEL }}
            ANTHROPIC_PROXY_URL=${{ secrets.ANTHROPIC_PROXY_URL }}
            ANTHROPIC_PROXY_USER=${{ secrets.ANTHROPIC_PROXY_USER }}
            ANTHROPIC_PROXY_PASS=${{ secrets.ANTHROPIC_PROXY_PASS }}
            EMBEDDING_BASE_URL=${{ vars.EMBEDDING_BASE_URL || 'https://openrouter.ai/api/v1' }}
            EMBEDDING_API_KEY=${{ secrets.EMBEDDING_API_KEY }}
            EMBEDDING_MODEL=${{ vars.EMBEDDING_MODEL || 'qwen/qwen3-embedding-8b' }}
            RERANKER_PROVIDER=${{ vars.RERANKER_PROVIDER || 'openai-rerank' }}
            RERANKER_SERVICE_URL=${{ vars.RERANKER_SERVICE_URL || 'reranker-service:8352' }}
            RERANKER_BASE_URL=${{ vars.RERANKER_BASE_URL || 'https://openrouter.ai/api/v1' }}
            RERANKER_API_KEY=${{ secrets.RERANKER_API_KEY }}
            RERANKER_MODEL=${{ vars.RERANKER_MODEL || 'qwen/qwen3-reranker-8b' }}
            MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
            MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
            MINIO_BUCKET=${{ vars.MINIO_BUCKET || 'default-documents' }}
            EOF
            
            chmod 600 .env
            
            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Create network if not exists
            docker network create arag-common-network 2>/dev/null || true
            
            # Deploy
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d --remove-orphans
            
            # Cleanup old images
            docker image prune -f

