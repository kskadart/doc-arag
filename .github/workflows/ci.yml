name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run ruff linter
        run: uv run ruff check src/ tests/ scripts/

      - name: Run ruff formatter check
        run: uv run ruff format --check src/ tests/ scripts/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run mypy
        run: uv run mypy src/ tests/ scripts/
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        env:
          LLM_PROVIDER: openai
          LLM_BASE_URL: http://llm.test/v1
          LLM_API_KEY: test-llm-key
          LLM_MODEL: test/chat-model
          EMBEDDING_BASE_URL: http://embed.test/v1
          EMBEDDING_API_KEY: test-embed-key
          EMBEDDING_MODEL: test/embedding-model
          RERANKER_PROVIDER: grpc
          RERANKER_SERVICE_URL: localhost:8352
          STARTUP_VERIFY_EMBEDDING_DIMENSION: "false"
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: test-access-key
          MINIO_SECRET_KEY: test-secret-key
          MINIO_BUCKET: test-bucket
          MINIO_SECURE: "false"
          WEAVIATE_HOST: localhost
          WEAVIATE_PORT: "8080"
