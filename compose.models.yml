# Point the api at model servers running NATIVELY on the macOS host (Metal):
#
#   scripts/local_models.sh start        # llama.cpp: chat :8081, embeddings :8082, rerank :8083
#   docker compose -f compose.yml -f compose.models.yml up -d
#
# Docker Desktop cannot expose the Apple GPU to Linux containers (GPU support
# in Docker Desktop exists only on Windows/WSL2), so the model processes stay
# on the host and the api reaches them through host.docker.internal.
# For a Linux GPU server use compose.sglang.yml instead.

services:
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:8081/v1}
      - LLM_API_KEY=${LLM_API_KEY:-EMPTY}
      - LLM_MODEL=${LLM_MODEL:-qwen3.8-27b}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://host.docker.internal:8082/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-EMPTY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3-embedding-8b}
      - RERANKER_PROVIDER=${RERANKER_PROVIDER:-openai-rerank}
      - RERANKER_BASE_URL=${RERANKER_BASE_URL:-http://host.docker.internal:8083/v1}
      - RERANKER_API_KEY=${RERANKER_API_KEY:-EMPTY}
      - RERANKER_MODEL=${RERANKER_MODEL:-qwen3-reranker-8b}
