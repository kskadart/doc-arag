[project]
name = "doc-arag"
version = "0.1.0"
description = "Agentic RAG system with document parsing and vector search"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard]==0.141.1",
    "langchain==1.3.16",
    "langchain-anthropic==1.6.1",
    "langchain-community==0.4.2",
    "langgraph==1.2.11",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "weaviate-client==4.23.0",
    "python-docx==1.2.0",
    "beautifulsoup4==4.15.0",
    "httpx==0.28.1",
    "minio==7.2.20",
    "python-multipart==0.0.32",
    "grpcio==1.78.0",
    "langchain-text-splitters==1.1.2",
    "tenacity==9.1.4",
    "pypdf==6.1.3",
    "python-magic==0.4.27",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "mypy==2.3.1",
    "pysentry-rs==0.5.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.22",
]

[tool.ruff]
exclude = ["*_pb2.py", "*_pb2_grpc.py"]

[tool.mypy]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
exclude = [".*_pb2.py$", ".*_pb2_grpc.py$"]

# Generated protobuf modules build their message classes at import time through
# the protobuf builder, so their attributes do not exist statically. "exclude"
# only skips them while collecting files, they are still followed as imports.
[[tool.mypy.overrides]]
module = [
    "src.docarag.embedding_pb2",
    "src.docarag.embedding_pb2_grpc",
]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
