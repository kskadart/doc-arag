services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: doc-arag
    ports:
      - "127.0.0.1:8103:8103"
    volumes:
      - ./src/docarag:/app/src/docarag
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_API_KEY=${LLM_API_KEY:-EMPTY}
      - LLM_MODEL=${LLM_MODEL:-qwen/qwen3.8-flash}
      - LLM_EXTRA_BODY=${LLM_EXTRA_BODY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - ANTHROPIC_PROXY_URL=${ANTHROPIC_PROXY_URL:-}
      - ANTHROPIC_PROXY_USER=${ANTHROPIC_PROXY_USER:-}
      - ANTHROPIC_PROXY_PASS=${ANTHROPIC_PROXY_PASS:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://openrouter.ai/api/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-EMPTY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
      - RERANKER_PROVIDER=${RERANKER_PROVIDER:-openai-rerank}
      - RERANKER_SERVICE_URL=${RERANKER_SERVICE_URL:-reranker-service:8352}
      - RERANKER_BASE_URL=${RERANKER_BASE_URL:-https://openrouter.ai/api/v1}
      - RERANKER_API_KEY=${RERANKER_API_KEY:-EMPTY}
      - RERANKER_MODEL=${RERANKER_MODEL:-qwen/qwen3-reranker-8b}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-docarag-root-user}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-default-password}
      - MINIO_BUCKET=${MINIO_BUCKET:-default-documents}
      - WEAVIATE_HOST=weaviate
      - WEAVIATE_PORT=8080
      - AUTH_MODE=${AUTH_MODE:-none}
      - AUTH_ADMIN_GROUP=${AUTH_ADMIN_GROUP:-admins}
    healthcheck:
      test: [
        "CMD", "python", "-c", "import urllib.request; \
        urllib.request.urlopen('http://localhost:8103/health').read()"
      ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      minio:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    networks:
      - arag-network

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: doc-arag-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-docarag-root-user}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-default-password}
      - MINIO_BUCKET=${MINIO_BUCKET:-default-documents}

    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - arag-network

  weaviate:
    image: semitechnologies/weaviate:1.39.0
    container_name: doc-arag-weaviate
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - weaviate-data:/var/lib/weaviate
    environment:
      - AUTOSCHEMA_ENABLED=false
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - CLUSTER_HOSTNAME=node1
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - arag-network

networks:
  arag-network:
    external: false
    name: arag-common-network

volumes:
  minio-data:
  weaviate-data: